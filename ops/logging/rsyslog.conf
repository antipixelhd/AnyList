# Dedicated input: these messages never enter the host's default log rules.
ruleset(name="anylistDocker") {
  if $programname == "anylist-application" then {
    action(type="omfile" file="/var/log/anylist/application.log" fileCreateMode="0640")
  } else if $programname == "anylist-database" then {
    action(type="omfile" file="/var/log/anylist/database.log" fileCreateMode="0640")
  }
  stop
}
input(type="imuxsock" Socket="/var/spool/rsyslog/anylist/docker.sock"
      CreatePath="on" UseSpecialParser="off" RateLimit.Interval="0" ruleset="anylistDocker")
