# Installed during bootstrap; root-controlled keys and forced command.
Match User anylist-preview-ci
    AuthorizedKeysFile /etc/anylist-preview/ci_authorized_keys
    ForceCommand /usr/local/bin/anylist-preview-ci
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
Match all
