name: "preview: manual actions"
on:
  workflow_dispatch:
    inputs:
      preview:
        type: choice
        required: true
        options: [beta, development-1, development-2]
      operation:
        type: choice
        required: true
        options: [status, restart, redeploy, reset-db-from-beta, recreate-preview, "Public beta.anylist ON", "Public beta.anylist OFF", public-beta-status]
permissions:
  contents: read
  id-token: write
concurrency:
  group: anylist-preview-${{ inputs.preview }}
  cancel-in-progress: false
jobs:
  operate:
    if: vars.PREVIEW_ENABLED == 'true'
    uses: ./.github/workflows/preview-remote.yml
    with:
      preview: ${{ inputs.preview }}
      operation: ${{ inputs.operation == 'Public beta.anylist ON' && 'public-beta-on' || inputs.operation == 'Public beta.anylist OFF' && 'public-beta-off' || inputs.operation }}
    secrets: inherit
