name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anylist
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: anylist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anylist -d anylist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-only-secret
      DATABASE_URL: postgresql+asyncpg://anylist:test-only-password@127.0.0.1:5432/anylist_test
      TRACKING_TEST_DATABASE_URL: postgresql+asyncpg://anylist:test-only-password@127.0.0.1:5432/anylist_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --group dev
      - name: Initialize disposable test database
        working-directory: backend
        run: uv run --no-sync alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: >-
          uv run --no-sync python ../scripts/backend_ci.py run
          --index ${{ strategy.job-index }} --count ${{ strategy.job-total }}
          --manifest ../ci-results/backend/shard-${{ strategy.job-index }}.json
      - name: Upload test inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-tests-${{ strategy.job-index }}
          path: ci-results/backend/shard-${{ strategy.job-index }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Lint backend
        if: ${{ strategy.job-index == 0 }}
        working-directory: backend
        run: uvx ruff==0.16.8 check .

  backend:
    if: ${{ always() }}
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend job to succeed
        env:
          RESULT: ${{ needs.backend-tests.result }}
        run: test "$RESULT" = success
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: backend-tests-*
          merge-multiple: true
          path: ci-results/backend
      - name: Verify complete test coverage
        run: python scripts/backend_ci.py verify ci-results/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend types
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
