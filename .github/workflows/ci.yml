name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anylist
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: anylist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anylist -d anylist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-only-secret
      DATABASE_URL: postgresql+asyncpg://anylist:test-only-password@127.0.0.1:5432/anylist_test
      TRACKING_TEST_DATABASE_URL: postgresql+asyncpg://anylist:test-only-password@127.0.0.1:5432/anylist_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --no-dev
      - name: Run backend tests
        working-directory: backend
        run: uv run --no-sync python -m unittest discover -s tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
