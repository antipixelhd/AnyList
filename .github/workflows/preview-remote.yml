name: Preview Remote
on:
  workflow_call:
    inputs:
      preview: {type: string, required: true}
      operation: {type: string, required: true}
      sha: {type: string, default: ''}
      forced: {type: string, default: 'false'}
    secrets:
      TS_OAUTH_CLIENT_ID: {required: true}
      TS_AUDIENCE: {required: true}
      PREVIEW_VPS_HOST: {required: true}
permissions:
  contents: read
  id-token: write
jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - name: Mask private preview hostname
        env:
          HOST: ${{ secrets.PREVIEW_VPS_HOST }}
        run: |
          printf '::add-mask::%s\n' "$HOST"
          printf '::add-mask::%s\n' "${HOST%%.*}"
          printf '::add-mask::%s\n' "${HOST#*.}"
      - uses: actions/checkout@v6
        with:
          ref: beta
          persist-credentials: false
      - name: Validate request and required configuration
        env:
          SLOT: ${{ inputs.preview }}
          OPERATION: ${{ inputs.operation }}
          SHA: ${{ inputs.sha }}
          FORCED: ${{ inputs.forced }}
          PREVIEW_VPS_HOST: ${{ secrets.PREVIEW_VPS_HOST }}
          CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, re
          from pathlib import Path
          sys.path.insert(0, 'ops/preview')
          from controller import load_slots, validate
          if os.environ['OPERATION'] == 'production-deploy':
              if (os.environ['SLOT'] != 'main' or os.environ['GITHUB_REF'] != 'refs/heads/main'
                      or not re.fullmatch(r'[0-9a-f]{40}', os.environ['SHA'])
                      or os.environ['FORCED'] != 'false'):
                  raise SystemExit('Production deployment requires a main commit')
          else:
              validate(load_slots(Path('ops/preview/slots.json')), os.environ['SLOT'],
                       os.environ['OPERATION'], os.environ['SHA'], os.environ['FORCED'])
          if not re.fullmatch(r'[a-z0-9][a-z0-9.-]*\.ts\.net', os.environ['PREVIEW_VPS_HOST']):
              raise SystemExit('Set PREVIEW_VPS_HOST to the private Tailscale FQDN')
          for name in ['CLIENT_ID', 'AUDIENCE']:
              if not os.environ[name]: raise SystemExit('Missing preview configuration: ' + name)
          PY
      - name: Join temporary CI tailnet node with workload identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          version: latest
          log-mode: quiet
      - name: Verify private connectivity
        env:
          HOST: ${{ secrets.PREVIEW_VPS_HOST }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, socket
          for address in {item[4][0] for item in socket.getaddrinfo(os.environ['HOST'], 22)}:
              print('::add-mask::' + address)
          PY
          tailscale ping --timeout=30s "$HOST" >/dev/null
      - name: Verify restricted CI commands
        if: inputs.operation == 'status'
        env:
          HOST: ${{ secrets.PREVIEW_VPS_HOST }}
        run: |
          set -euo pipefail
          for command in 'id' 'preview reset-db-from-beta beta'; do
            if timeout 20s tailscale ssh "anylist-preview-ci@$HOST" "$command" >refused.log 2>&1; then
              echo 'Restricted CI command unexpectedly succeeded' >&2
              exit 1
            fi
            grep -q 'Preview command refused' refused.log || {
              cat refused.log
              echo "Expected CI refusal message missing for: $command" >&2
              exit 1
            }
          done
          for user in root ubuntu; do
            if timeout 20s tailscale ssh "$user@$HOST" id >refused.log 2>&1; then
              echo 'Privileged SSH account unexpectedly accessible' >&2
              exit 1
            fi
            grep -Eqi 'permission denied|access denied|not allowed|does not permit|SSH denied|no matching SSH' refused.log || {
              cat refused.log
              echo "Expected SSH policy refusal missing for account: $user" >&2
              exit 1
            }
          done
          if timeout 20s tailscale ssh "anylist-preview-ci@$HOST" </dev/null >refused.log 2>&1; then
            echo 'Interactive login unexpectedly succeeded' >&2
            exit 1
          fi
          grep -q 'Interactive login is disabled' refused.log
          for path in /etc/anylist-preview/beta.env /opt/anylist/.env.production; do
            printf 'get %s %s/sftp-protected-file\n' "$path" "$RUNNER_TEMP" >access.batch
            if timeout 20s sftp -b access.batch \
              -o "UserKnownHostsFile=$HOME/.config/tailscale/ssh_known_hosts" \
              -o "HostKeyAlias=$HOST." -o 'StrictHostKeyChecking=yes' \
              -o 'ProxyCommand=tailscale nc %h %p' "anylist-preview-ci@$HOST" >refused.log 2>&1; then
              echo 'Protected file unexpectedly readable through SFTP' >&2
              exit 1
            fi
            grep -Eqi 'permission denied|not found|Preview command refused|Connection closed' refused.log || {
              cat refused.log
              exit 1
            }
          done
          python3 - <<'PY'
          import os, struct, subprocess
          result = subprocess.run(['tailscale', 'ssh', 'anylist-preview-ci@' + os.environ['HOST'],
                                   '-W', '127.0.0.1:5432'], input=struct.pack('!II', 8, 80877103),
                                  capture_output=True, timeout=20)
          if result.stdout[:1] in (b'S', b'N'):
              raise SystemExit('SSH forwarding reached PostgreSQL; isolation is incomplete')
          if b'prohibited' not in result.stderr.lower() and b'not permitted' not in result.stderr.lower():
              print(result.stderr.decode(errors='replace'))
              raise SystemExit('Forwarding denial was not verified')
          PY
          echo 'Restricted commands, accounts, interactive login, protected SFTP reads and forwarding verified.'
      - name: Run installed deployment entrypoint
        env:
          HOST: ${{ secrets.PREVIEW_VPS_HOST }}
          SLOT: ${{ inputs.preview }}
          OPERATION: ${{ inputs.operation }}
          SHA: ${{ inputs.sha }}
          FORCED: ${{ inputs.forced }}
        run: |
          set -euo pipefail
          args=(preview "$OPERATION" "$SLOT")
          if [[ "$OPERATION" == deploy ]]; then args+=("$SHA" "$FORCED"); fi
          if [[ "$OPERATION" == production-deploy ]]; then args=(anylist deploy "$SHA"); fi
          if [[ "$OPERATION" == provision ]]; then
            tailscale ssh "anylist-preview-ci@$HOST" preview sync-config beta
          fi
          result=0
          tailscale ssh "anylist-preview-ci@$HOST" "${args[@]}" | tee preview-result.log || result=$?
          {
            printf '### Deployment %s — %s\n\n' "$SLOT" "$OPERATION"
            printf '```text\n'
            tail -n 80 preview-result.log
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Notify if production controller could not be started
        if: failure() && inputs.operation == 'production-deploy'
        env:
          SHA: ${{ inputs.sha }}
        run: |
          # Once the detached controller starts, the VPS owns the final notification.
          if grep -q '^ANYLIST_DEPLOYMENT_CONTROLLER_STARTED$' preview-result.log 2>/dev/null; then exit 0; fi
          curl --fail --silent --show-error --max-time 10 --retry 2 \
            -H 'Title: AnyList deployment failed' -H 'Tags: warning' -H 'Priority: high' \
            --data-binary "GitHub could not confirm that production deployment ${SHA:0:12} started. Check the Actions run and VPS logs." \
            https://ntfy.sh/anylist-deployment-1111 >/dev/null
