name: Preview Remote
on:
  workflow_call:
    inputs:
      preview: {type: string, required: true}
      operation: {type: string, required: true}
      sha: {type: string, default: ''}
      forced: {type: string, default: 'false'}
    secrets:
      TS_OAUTH_CLIENT_ID: {required: true}
      TS_AUDIENCE: {required: true}
      PREVIEW_SSH_PRIVATE_KEY: {required: true}
      PREVIEW_SSH_KNOWN_HOSTS: {required: true}
permissions:
  contents: read
  id-token: write
jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: beta
          persist-credentials: false
      - name: Validate request and required configuration
        env:
          SLOT: ${{ inputs.preview }}
          OPERATION: ${{ inputs.operation }}
          SHA: ${{ inputs.sha }}
          FORCED: ${{ inputs.forced }}
          PREVIEW_VPS_HOST: ${{ vars.PREVIEW_VPS_HOST }}
          CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          SSH_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, re
          from pathlib import Path
          sys.path.insert(0, 'ops/preview')
          from controller import load_slots, validate
          validate(load_slots(Path('ops/preview/slots.json')), os.environ['SLOT'],
                   os.environ['OPERATION'], os.environ['SHA'], os.environ['FORCED'])
          if not re.fullmatch(r'[a-z0-9][a-z0-9.-]*\.ts\.net', os.environ['PREVIEW_VPS_HOST']):
              raise SystemExit('Set PREVIEW_VPS_HOST to the private Tailscale FQDN')
          for name in ['CLIENT_ID', 'AUDIENCE', 'SSH_KEY', 'KNOWN_HOSTS']:
              if not os.environ[name]: raise SystemExit('Missing preview configuration: ' + name)
          PY
      - name: Join temporary CI tailnet node with workload identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Verify private connectivity
        env:
          HOST: ${{ vars.PREVIEW_VPS_HOST }}
        run: |
          set -euo pipefail
          tailscale ping --timeout=30s "$HOST"
          # Expansion belongs to the inner bash; HOST is passed as its positional argument.
          # shellcheck disable=SC2016
          timeout 15 bash -c 'exec 3<>/dev/tcp/$1/22' -- "$HOST"
      - name: Run installed preview entrypoint
        env:
          HOST: ${{ vars.PREVIEW_VPS_HOST }}
          SSH_KEY: ${{ secrets.PREVIEW_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
          SLOT: ${{ inputs.preview }}
          OPERATION: ${{ inputs.operation }}
          SHA: ${{ inputs.sha }}
          FORCED: ${{ inputs.forced }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          args=(preview "$OPERATION" "$SLOT")
          if [[ "$OPERATION" == deploy ]]; then args+=("$SHA" "$FORCED"); fi
          ssh_options=(-T -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          if [[ "$OPERATION" == provision ]]; then
            # SSH options intentionally expand locally; command is a fixed literal.
            # shellcheck disable=SC2029
            ssh "${ssh_options[@]}" "anylist-preview-ci@$HOST" 'preview sync-config beta'
          fi
          result=0
          # Validated remote arguments intentionally expand on this runner.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" \
            "anylist-preview-ci@$HOST" "${args[*]}" | tee preview-result.log || result=$?
          {
            printf '### Preview %s — %s\n\n' "$SLOT" "$OPERATION"
            printf '```text\n'
            tail -n 80 preview-result.log
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
