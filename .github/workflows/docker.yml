name: Publish AnyList container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: anylist-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/antipixelhd/anylist:latest
            ghcr.io/antipixelhd/anylist:sha-${{ github.sha }}
          cache-from: type=gha,scope=anylist-container
          cache-to: type=gha,mode=max,scope=anylist-container

  deploy:
    name: Update VPS with automatic rollback
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mask private hostname
        env:
          HOST: ${{ secrets.PREVIEW_VPS_HOST }}
        run: |
          printf '::add-mask::%s\n' "$HOST"
          printf '::add-mask::%s\n' "${HOST%%.*}"
          printf '::add-mask::%s\n' "${HOST#*.}"
      - name: Join private deployment network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          version: latest
          log-mode: quiet
      - name: Deploy published main commit
        env:
          HOST: ${{ secrets.PREVIEW_VPS_HOST }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tailscale ssh "anylist-preview-ci@$HOST" anylist deploy "$SHA"
