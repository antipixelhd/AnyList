name: Publish AnyList container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: anylist-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/antipixelhd/anylist:latest
            ghcr.io/antipixelhd/anylist:sha-${{ github.sha }}
          cache-from: type=gha,scope=anylist-container
          cache-to: type=gha,mode=max,scope=anylist-container

  deploy:
    name: Update VPS with automatic rollback
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/preview-remote.yml
    with:
      preview: main
      operation: production-deploy
      sha: ${{ github.sha }}
    secrets: inherit

  notify-build-failure:
    name: Notify failed image build
    needs: build
    if: always() && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify ntfy
        env:
          SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 2 \
            -H 'Title: AnyList deployment failed' -H 'Tags: warning' -H 'Priority: high' \
            --data-binary "Production AnyList image build ${SHA:0:12} failed. The VPS deployment was not started." \
            https://ntfy.sh/anylist-deployment-1111 >/dev/null
